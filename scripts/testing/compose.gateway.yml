# Combine with compose.yml; isolated synthetic local verification only.
services:
  database:
    networks: [default, local_entry]
    volumes:
      - ./gateway-init.sql:/docker-entrypoint-initdb.d/gateway-init.sql:ro
  gateway:
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    environment:
      PGRST_DB_URI: postgres://authenticator:local-gateway-only@database:5432/momo_security_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-gateway-test-secret-at-least-32-characters
      PGRST_DB_POOL: 5
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: 5
      PGRST_DB_CONFIG: 'false'
    depends_on:
      database:
        condition: service_healthy
  router:
    networks: [default, local_entry]
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./gateway-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:${MOMO_TEST_GATEWAY_PORT:-56439}:8080'
    depends_on:
      - gateway
networks:
  default:
    internal: true
  local_entry: {}
