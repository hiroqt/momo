[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyJWT[crypto]>=2.10.1",
    "boto3>=1.43.97",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "supabase>=2.31.0",
    "sympy>=1.14.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
# Static analysis pinned to the versions used by scripts/testing/static_checks.py.
dev = [
    "mypy==2.4.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
# Run from backend/: `uv run mypy`. Matches scripts/testing/static_checks.py.
files = ["app"]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
